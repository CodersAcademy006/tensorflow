# CPU-only fork CI mirror for lint validation before upstream PR submission
name: Fork CI Mirror (Lint)
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  lint-check:
    # Run on PR comments containing "/run-ci-mirror" or on regular PR events
    if: |
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/run-ci-mirror'))
    name: PyLint Mirror
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
    - name: Set up Python 3.9
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
      with:
        python-version: "3.9"
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint==2.13.9 numpy wheel
    - name: Run PyLint on Python files
      run: |
        find tensorflow -name '*.py' -type f | head -200 | xargs pylint --rcfile=tensorflow/tools/ci_build/pylintrc
